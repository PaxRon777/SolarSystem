<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Solar System Simulator - Local</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }

        canvas {
            display: block;
        }

        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            pointer-events: none;
            text-shadow: 2px 2px 4px black;
        }

        #ui-panel {
            position: absolute;
            top: 160px; /* Shifted down to clear info text */
            left: 20px;
            padding: 20px;
            border-radius: 15px;
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            color: white;
            -webkit-user-select: none;
            user-select: none;
            z-index: 100;
            max-height: 85vh;
            overflow-y: auto; /* Allow scrolling if panel gets too long */
        }

        #ui-panel h2 {
            margin: 0 0 15px 0;
            font-size: 1.1rem;
            border-bottom: 1px solid rgba(255,255,255,0.3);
            padding-bottom: 5px;
        }

        #ui-panel .control-group {
            margin-bottom: 20px;
        }

        #ui-panel label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        #ui-panel input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        /* Toggle Switch Styles */
        .switch-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding: 4px 0;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 34px;
            height: 18px;
        }

        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #555;
            transition: .4s;
            border-radius: 18px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 12px;
            width: 12px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #4CAF50;
        }

        input:checked + .slider:before {
            transform: translateX(16px);
        }

        /* Planet Info Panel - Charcoal themed */
        #planet-info-panel {
            position: absolute;
            right: 0;
            top: 0;
            width: 350px; 
            height: 100%;
            background: rgba(26, 26, 28, 0.814); /* Charcoal dark grey */
            backdrop-filter: blur(10px);
            border-left: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: -8px 0 32px 0 rgba(0, 0, 0, 0.6);
            padding: 20px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }

        #close-panel {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
        }

        #planet-info-panel h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-align: center;
            color: white;
        }

        .planet-image-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
            margin-bottom: 20px;
            position: relative;
        }

        /* Spinning planet container */
        #spinning-planet {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        /* Planet spinning animation - Three.js canvas fills container */
        #spinning-planet canvas {
            width: 180px !important;
            height: 180px !important;
        }

        .info-section h2 {
            color: #3b82f6; /* Accent blue */
            font-size: 1.4em;
            margin-top: 20px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.5); /* Blue glow */
        }

        .info-content {
            line-height: 1.6;
            color: #e0e0e0;
        }

        /* Info list styling for Physical Properties and Orbital Characteristics */
        .info-section h2 {
            color: #3b82f6; /* Accent blue */
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.2); /* Subtle divider */
        }

        .info-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .info-list li {
            display: flex;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            color: #e0e0e0;
        }

        .info-list li:last-child {
            border-bottom: none;
        }

        .info-list li::before {
            content: "•";
            color: rgba(148, 163, 184, 0.5); /* Subtle bullet */
            margin-right: 8px;
        }

        .info-list li strong {
            color: #94a3b8; /* Muted label color */
            font-weight: 500;
        }

        .pipe-separator {
            display: inline-block;
            width: 24px;
            text-align: center;
            color: rgba(148, 163, 184, 0.3); /* Very subtle pipe */
        }

        .info-list li span:not(.pipe-separator) {
            margin-left: 8px;
            font-weight: 500;
            color: #e2e8f0;
        }

        /* Spacing between sections */
        .info-section + .info-section {
            margin-top: 16px;
        }

        /* Planet Buttons - Styled to match the charcoal theme */
        .planet-button {
            width: 100px; /* Increased width for full planet names */
            height: 40px;
            border-radius: 8px; /* Rounded corners as requested */
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            transition: all 0.3s ease;
            text-align: center;
            margin-right: 10px; /* Space between button and toggle */
        }

        .planet-button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        /* Spinner animation for loading state */
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .spinner {
            animation: spin 2s linear infinite;
        }
    </style>
</head>

<body style="background-color: black;">
    <div id="info">
        <h1 style="color: white;">3D SOLAR SYSTEM SIMULATOR</h1>
        <p style="color: white;">Hold left click to rotate and wheel to zoom</p>
    </div>

    <div id="ui-panel">
        <h2>Controls</h2>
        <div class="control-group">
            <label for="speedSlider">Orbit Speed</label>
            <input type="range" id="speedSlider" min="0" max="10" step="0.1" value="1">
        </div>

        <div class="control-group">
            <label><input type="checkbox" id="textToggle" checked> Show Labels</label>
            <label><input type="checkbox" id="orbitToggle" checked> Show Orbit Paths</label>
        </div>

        <h2>Planets</h2>
        <div id="planet-toggles">
            <!-- Mercury -->
            <div class="switch-container">
                <button class="planet-button" data-planet="mercury">Mercury</button>
                <label class="switch"><input type="checkbox" data-id="0" checked><span class="slider"></span></label>
            </div>
            
            <!-- Venus -->
            <div class="switch-container">
                <button class="planet-button" data-planet="venus">Venus</button>
                <label class="switch"><input type="checkbox" data-id="1" checked><span class="slider"></span></label>
            </div>
            
            <!-- Earth -->
            <div class="switch-container">
                <button class="planet-button" data-planet="earth">Earth</button>
                <label class="switch"><input type="checkbox" data-id="2" checked><span class="slider"></span></label>
            </div>
            
            <!-- Mars -->
            <div class="switch-container">
                <button class="planet-button" data-planet="mars">Mars</button>
                <label class="switch"><input type="checkbox" data-id="3" checked><span class="slider"></span></label>
            </div>
            
            <!-- Jupiter -->
            <div class="switch-container">
                <button class="planet-button" data-planet="jupiter">Jupiter</button>
                <label class="switch"><input type="checkbox" data-id="4" checked><span class="slider"></span></label>
            </div>
            
            <!-- Saturn -->
            <div class="switch-container">
                <button class="planet-button" data-planet="saturn">Saturn</button>
                <label class="switch"><input type="checkbox" data-id="5" checked><span class="slider"></span></label>
            </div>
            
            <!-- Uranus -->
            <div class="switch-container">
                <button class="planet-button" data-planet="uranus">Uranus</button>
                <label class="switch"><input type="checkbox" data-id="6" checked><span class="slider"></span></label>
            </div>
            
            <!-- Neptune -->
            <div class="switch-container">
                <button class="planet-button" data-planet="neptune">Neptune</button>
                <label class="switch"><input type="checkbox" data-id="7" checked><span class="slider"></span></label>
            </div>
        </div>
    </div>

    <!-- Planet Info Panel -->
    <div id="planet-info-panel">
    <button id="close-panel">×</button>
    <h1 id="panel-title"></h1>
    <div class="planet-image-container">
        <div id="spinning-planet" class="planet-spinning"></div>
    </div>
        
    <div class="info-section">
        <h2>Overview</h2>
        <p id="overview-content" class="info-content"></p>
    </div>
        
    <div class="info-section">
        <h2 id="combined-heading"><span>Physical Properties</span><span class="header-separator"> | </span><span>Orbital Characteristics</span></h2>
        <ul id="physical-properties" class="info-list"></ul>
    </div>
        
    <div class="info-section section-divider">
        <!-- Orbital characteristics list rendered below Physical Properties in the same section -->
        <ul id="orbital-characteristics" class="info-list"></ul>
    </div>
        
    <div class="info-section">
        <h2>Moons & Rings</h2>
        <p id="moons-content" class="info-content"></p>
    </div>

    <div class="info-section">
        <h2>Atmosphere</h2>
        <p id="atmosphere-content" class="info-content"></p>
    </div>
    </div>

    <script src="./threejs/three.min.js"></script>
    <script src="./threejs/OrbitControls.js"></script>
    
    <!-- Assuming textures.js is in the same folder -->
    <script src="./textures.js"></script>
    <script>
         // --- Scene Setup ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 5000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        // Enable shadow maps in the renderer
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; 
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        camera.position.set(0, 150, 300);
        controls.update();

        // --- Lights ---
        // Ambient light: illuminates the shadows slightly so things aren't pitch black
        const ambientLight = new THREE.AmbientLight(0x404040, 0.5); 
        scene.add(ambientLight);

        // Point Light: Acts as the Sun (at center of the scene)
        const sunLight = new THREE.PointLight(0xffffff, 2.5, 1000); // Color, Intensity, Distance
        sunLight.castShadow = true;
        // Improve shadow quality
        sunLight.shadow.mapSize.width = 1024;
        sunLight.shadow.mapSize.height = 1024;
        scene.add(sunLight);

        // --- Milky Way Background (Skybox) ---
        let skyMat;
        if (textureMap["milkyway"] && textureMap["milkyway"].length > 20) {
            skyMat = new THREE.MeshBasicMaterial({ map: new THREE.TextureLoader().load(textureMap["milkyway"]), side: THREE.BackSide });
        } else {
            skyMat = new THREE.MeshBasicMaterial({ color: 0x050505, side: THREE.BackSide });
        }
        const sky = new THREE.Mesh(new THREE.SphereGeometry(2000, 64, 64), skyMat);
        scene.add(sky);

        // --- Starfield ---
        const starGeometry = new THREE.BufferGeometry();
        const starMaterial = new THREE.PointsMaterial({ color: 0xffffff });
        const starVertices = [];
        for (let i = 0; i < 10000; i++) {
            starVertices.push((Math.random() - 0.5) * 2000, (Math.random() - 0.5) * 2000, (Math.random() - 0.5) * 2000);
        }
        starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
        const stars = new THREE.Points(starGeometry, starMaterial);
        scene.add(stars);

        // --- Texture Loader ---
        const loader = new THREE.TextureLoader();

        // --- Helper: Create Planet with Label ---
        function createPlanet(name, size, distance, color, speed, hasMoon = false) {
            const orbitGroup = new THREE.Group();
            scene.add(orbitGroup);

            const planetGroup = new THREE.Group();
            planetGroup.position.x = distance; 
            orbitGroup.add(planetGroup);

            const geometry = new THREE.SphereGeometry(size, 32, 32);
            let material;

            // Use MeshStandardMaterial for planets so they react to the sunLight
            if (textureMap[name] && textureMap[name].length > 20) {
                material = new THREE.MeshStandardMaterial({ map: loader.load(textureMap[name]) });
            } else {
                material = new THREE.MeshStandardMaterial({ color: color });
            }

            const mesh = new THREE.Mesh(geometry, material);
            mesh.castShadow = true;       // Casts shadow onto other objects (like moons)
            mesh.receiveShadow = true;    // Receives shadows from the Sun/Moons
            planetGroup.add(mesh); 

            // The Label (Sprite)
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = 1024; 
            canvas.height = 512;  

            context.fillStyle = 'rgba(0, 0, 0, 0.6)'; 
            const panelHeight = 180; 
            const startY = (canvas.height - panelHeight) / 2;
            context.fillRect(0, startY, canvas.width, panelHeight);

            context.strokeStyle = 'black'; 
            context.lineWidth = 25; 
            context.font = 'Bold 180px Arial'; 
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            const upperName = name.toUpperCase();
            context.strokeText(upperName, canvas.width / 2, canvas.height / 2);
            context.fillStyle = 'white'; 
            context.fillText(upperName, canvas.width / 2, canvas.height / 2);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({ map: texture });
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.scale.set(size * 1.4, (size * 1.4) * 0.6, 1);
            sprite.position.y = size + (size * 0.5); 
            planetGroup.add(sprite);

            // Orbit Path Ring
            const orbitGeom = new THREE.RingGeometry(distance - 0.2, distance + 0.2, 64);
            const orbitMat = new THREE.MeshBasicMaterial({ color: 0x444444, side: THREE.DoubleSide });
            const orbitRing = new THREE.Mesh(orbitGeom, orbitMat);
            orbitRing.rotation.x = Math.PI / 2;
            scene.add(orbitRing);

            // Moon Logic
            let moon = null;
            if (hasMoon) {
                const moonGeom = new THREE.SphereGeometry(size * 0.3, 16, 16);
                let moonMat;
                if (textureMap["moon"] && textureMap["moon"].length > 20) {
                    moonMat = new THREE.MeshStandardMaterial({ map: loader.load(textureMap["moon"]) });
                } else {
                    moonMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa });
                }
                moon = new THREE.Mesh(moonGeom, moonMat);
                moon.position.x = size + 4; 
                moon.castShadow = true;
                moon.receiveShadow = true;
                planetGroup.add(moon); 
            }

            // Saturn's Rings Logic
            let saturnRing = null;
            if (name === "Saturn") {
                const ringGeom = new THREE.RingGeometry(size * 1.8, size * 2.8, 64);
                let ringMat;
                if (textureMap["saturnring"] && textureMap["saturnring"].length > 20) {
                    ringMat = new THREE.MeshStandardMaterial({ map: loader.load(textureMap["saturnring"]), side: THREE.DoubleSide, transparent: true });
                } else {
                    ringMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, side: THREE.DoubleSide, transparent: true, opacity: 0.6 });
                }
                saturnRing = new THREE.Mesh(ringGeom, ringMat);
                saturnRing.rotation.x = Math.PI / 2; 
                planetGroup.add(saturnRing); 
            }

            return { orbitGroup, planetGroup, speed, sprite: sprite, orbitRing: orbitRing };
        }

        // --- Create Solar System (All 8 Planets) ---
        const planets = [
            createPlanet("Mercury", 1.5, 20, 0xaaaaaa, 0.04 * 0.4),
            createPlanet("Venus", 3, 30, 0xffcc00, 0.015 * 0.4),
            createPlanet("Earth", 3.2, 45, 0x2233ff, 0.01 * 0.4, true),
            createPlanet("Mars", 2, 60, 0xff4400, 0.008 * 0.4, true),
            createPlanet("Jupiter", 10, 90, 0xccaa88, 0.004 * 0.4),
            createPlanet("Saturn", 8, 120, 0xffddaa, 0.002 * 0.4),
            createPlanet("Uranus", 7, 150, 0xadd8e6, 0.001 * 0.4),
            createPlanet("Neptune", 6, 180, 0x0000ff, 0.0008 * 0.4)
        ];

        // The Sun - Using MeshBasicMaterial so the texture displays perfectly and isn't affected by light
        const sunGeom = new THREE.SphereGeometry(15, 32, 32);
        let sunMat;
        if (textureMap["sun"] && textureMap["sun"].length > 20) {
            // BasicMaterial ensures the texture is always visible and "lit"
            sunMat = new THREE.MeshBasicMaterial({ map: loader.load(textureMap["sun"]) });
        } else {
            sunMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
        }
        const sun = new THREE.Mesh(sunGeom, sunMat);
        scene.add(sun);

        // --- UI Interaction Logic ---
        let orbitSpeedMultiplier = 1;
        const speedSlider = document.getElementById('speedSlider');
        const textToggle = document.getElementById('textToggle');
        const orbitToggle = document.getElementById('orbitToggle');

        speedSlider.addEventListener('input', (e) => {
            orbitSpeedMultiplier = e.target.value;
        });

        textToggle.addEventListener('change', (e) => {
            planets.forEach(p => {
                if (p.sprite) p.sprite.visible = e.target.checked;
            });
        });

        orbitToggle.addEventListener('change', (e) => {
            planets.forEach(p => {
                if (p.orbitRing) p.orbitRing.visible = e.target.checked;
            });
        });

        // Planet individual toggles logic
        document.querySelectorAll('#planet-toggles input').forEach(checkbox => {
            checkbox.addEventListener('change', (e) => {
                const index = e.target.getAttribute('data-id');
                if (planets[index]) {
                    const isChecked = e.target.checked;
                    // Hide both the planet mesh/group and its specific orbit ring
                    planets[index].planetGroup.visible = isChecked;
                    if(planets[index].orbitRing) planets[index].orbitRing.visible = isChecked;
                }
            });
        });

        // --- Planet Info Panel Logic ---
        const panel = document.getElementById('planet-info-panel');
        const closePanelBtn = document.getElementById('close-panel');
        const panelTitle = document.getElementById('panel-title');
        const spinningPlanetContainer = document.getElementById('spinning-planet');
        const overviewContent = document.getElementById('overview-content');
        const physicalPropsList = document.getElementById('physical-properties');
        const orbitalCharList = document.getElementById('orbital-characteristics');
        const moonsContent = document.getElementById('moons-content');
        const atmosphereContent = document.getElementById('atmosphere-content');

        // Helper: populate a list element with key-value pairs
        function renderInfoList(container, data) {
            container.innerHTML = '';
            data.forEach(item => {
                const li = document.createElement('li');
                li.innerHTML = `<strong>${item.label}</strong><span class="pipe-separator"> | </span><span>${item.value}</span>`;
                container.appendChild(li);
            });
        }

        // Planet information data (detailed, SI units: km, degrees)
        const planetInfo = {
            mercury: {
                name: "Mercury",
                overview: "The smallest planet in our solar system and closest to the Sun. Despite being nearest to the Sun, it isn't the hottest planet due to its lack of atmosphere.",
                physicalProperties: [
                    { label: "Diameter", value: "4,879 km" },
                    { label: "Mass", value: "3.285 × 10²³ kg" },
                    { label: "Surface Area", value: "7.48 × 10⁷ km²" },
                    { label: "Volume", value: "6.083 × 10¹⁰ km³" },
                    { label: "Density", value: "5.427 g/cm³" },
                    { label: "Surface Gravity", value: "3.7 m/s²" },
                    { label: "Escape Velocity", value: "4.25 km/s" }
                ],
                orbitalCharacteristics: [
                    { label: "Sun Distance", value: "57.9 million km (0.387 AU)" },
                    { label: "Orbital Period", value: "87.97 days" },
                    { label: "Orbital Velocity", value: "47.36 km/s" },
                    { label: "Inclination", value: "7.0° to ecliptic" },
                    { label: "Eccentricity", value: "0.2056" },
                    { label: "Axial Tilt", value: "0.034° (essentially zero)" },
                    { label: "Rotation Period", value: "58.6 Earth days" }
                ],
                moons: "Mercury has no moons. Its proximity to the Sun and strong solar tidal forces prevent any stable satellite orbits.",
                atmosphere: "Virtually no atmosphere. Mercury has an extremely tenuous exosphere containing oxygen, sodium, hydrogen, helium, and potassium atoms blasted off from its surface by solar wind."
            },
            
            venus: {
                name: "Venus",
                overview: "Often called Earth's 'sister planet' due to similar size and mass. Venus has the hottest surface of any planet in our solar system at 462°C (864°F) despite being farther from the Sun than Mercury.",
                physicalProperties: [
                    { label: "Diameter", value: "12,104 km" },
                    { label: "Mass", value: "4.867 × 10²⁴ kg" },
                    { label: "Surface Area", value: "4.602 × 10⁸ km²" },
                    { label: "Volume", value: "9.284 × 10¹¹ km³" },
                    { label: "Density", value: "5.243 g/cm³" },

                ],

                    { label: "Inclination", value: "3.39° to ecliptic" },
                    { label: "Eccentricity", value: "0.0068 (nearly circular)" },
                    { label: "Axial Tilt", value: "177.4° (retrograde rotation)" },
                    { label: "Rotation Period", value: "-243 Earth days (retrograde)" }
                ],
                moons: "Venus has no moons. Its proximity to the Sun and lack of a significant magnetic field make moon capture unlikely.",
                atmosphere: "Extremely dense atmosphere composed of 96.5% carbon dioxide and 3.5% nitrogen. Surface pressure is 92 times that of Earth's. Thick clouds of sulfuric acid create a runaway greenhouse effect."
            },
            
            earth: {

                overview: "The only known planet to support life. Earth has liquid water on its surface, a protective magnetic field, and an atmosphere rich in nitrogen and oxygen that shields from harmful radiation.",

        // --- Mini Three.js scene for the spinning planet in the info panel ---
        const miniScene = new THREE.Scene();
        const miniCamera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
        miniCamera.position.z = 3;

        // Shared light so the mini sphere looks lit like the main scene
        const miniAmbientLight = new THREE.AmbientLight(0x404040, 0.8);
        miniScene.add(miniAmbientLight);
        const miniSunLight = new THREE.DirectionalLight(0xffffff, 1.5);
        miniSunLight.position.set(2, 2, 3);
        miniScene.add(miniSunLight);

        // Keep a reference to the current spinning renderer so we can dispose it
        let spinningRenderer = null;
        let spinningMesh = null;
        let spinningRing = null;
        let spinningAnimId = null;

        function createSpinningPlanet(planetName) {
            // Cancel previous animation loop
            if (spinningAnimId !== undefined) cancelAnimationFrame(spinningAnimId);
            spinningAnimId = undefined;

            // Dispose old renderer and meshes
            if (spinningRenderer) {
                spinningRenderer.dispose();
                spinningRenderer = null;
            }
            if (spinningMesh) { miniScene.remove(spinningMesh); spinningMesh = null; }
            if (spinningRing) { miniScene.remove(spinningRing); spinningRing = null; }

            // Clear container
            spinningPlanetContainer.innerHTML = '';

            const size = 180;

            // Create a renderer that targets our container
            spinningRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            spinningRenderer.setSize(size, size);
            spinningRenderer.setPixelRatio(1);
            spinningPlanetContainer.appendChild(spinningRenderer.domElement);

            // Determine the texture for this planet from textureMap
            const texKey = capitalizeFirst(planetName); // e.g. "mercury" -> "Mercury"
            let material;
            if (textureMap[texKey] && textureMap[texKey].length > 20) {
                material = new THREE.MeshStandardMaterial({ map: loader.load(textureMap[texKey]) });
            } else {
                // Fallback to the solid color from the main scene
                const fallbackColors = {
                    mercury: 0xaaaaaa, venus: 0xffcc00, earth: 0x2233ff, mars: 0xff4400,
                    jupiter: 0xccaa88, saturn: 0xffddaa, uranus: 0xadd8e6, neptune: 0x0000ff
                };
                material = new THREE.MeshStandardMaterial({ color: fallbackColors[planetName.toLowerCase()] || 0xffffff });
            }

            // Sphere geometry — high resolution so texture looks good at 180px
            const sphereGeom = new THREE.SphereGeometry(1, 64, 64);
            spinningMesh = new THREE.Mesh(sphereGeom, material);
            miniScene.add(spinningMesh);

            // Saturn rings
            if (planetName.toLowerCase() === 'saturn') {
                const ringGeom = new THREE.RingGeometry(1.3, 2.0, 64);
                let ringMat;
                if (textureMap["saturnring"] && textureMap["saturnring"].length > 20) {
                    ringMat = new THREE.MeshStandardMaterial({ map: loader.load(textureMap["saturnring"]), side: THREE.DoubleSide, transparent: true });
                } else {
                    ringMat = new THREE.MeshStandardMaterial({ color: 0xccaa88, side: THREE.DoubleSide, transparent: true, opacity: 0.7 });
                }
                spinningRing = new THREE.Mesh(ringGeom, ringMat);
                spinningRing.rotation.x = Math.PI * 0.45; // Tilted like real Saturn
                miniScene.add(spinningRing);
            }

            // Animation loop for the mini scene
            function renderMini() {
                spinningAnimId = requestAnimationFrame(renderMini);
                if (spinningMesh) spinningMesh.rotation.y += 0.008;
                if (spinningRing) spinningRing.rotation.z += 0.003;
                spinningRenderer.render(miniScene, miniCamera);
            }
            renderMini();
        }

        // Helper: capitalize first letter (mercury -> Mercury)
        function capitalizeFirst(s) {
            return s.charAt(0).toUpperCase() + s.slice(1);
        }

        // Show planet info panel with spinning planet
        function showPlanetInfo(planetName) {
            const info = planetInfo[planetName.toLowerCase()];
            if (!info) return;
            
            panelTitle.textContent = info.name;
            overviewContent.textContent = info.overview;
            
            // Render physical properties list
            renderInfoList(physicalPropsList, info.physicalProperties);
            
            // Render orbital characteristics list
            renderInfoList(orbitalCharList, info.orbitalCharacteristics);
            
            moonsContent.textContent = info.moons;
            atmosphereContent.textContent = info.atmosphere;
            
            // Create spinning planet visualization
            createSpinningPlanet(planetName);
            
            panel.style.display = 'block';
        }

        // Close panel
        closePanelBtn.addEventListener('click', () => {
            panel.style.display = 'none';
        });

        // Planet buttons click handlers - both new and existing buttons
        document.querySelectorAll('.planet-button').forEach(button => {
            button.addEventListener('click', (e) => {
                const planetName = e.target.getAttribute('data-planet');
                showPlanetInfo(planetName);
            });
        });

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);

            planets.forEach((p) => {
                // Only rotate if the group is visible (optional, but cleaner for performance)
                if (p.planetGroup.visible !== false || p.orbitGroup.rotation.y > 0) {
                    p.orbitGroup.rotation.y += p.speed * orbitSpeedMultiplier; 
                    p.planetGroup.rotation.y += 0.01;    
                }
            });

            // Sun rotation
            sun.rotation.y += 0.002; 

            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
