<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Solar System Simulator - Local</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }

        canvas {
            display: block;
        }

        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            pointer-events: none;
            text-shadow: 2px 2px 4px black;
        }

        #ui-panel {
            position: absolute;
            top: 160px; /* Shifted down to clear info text */
            left: 20px;
            padding: 20px;
            border-radius: 15px;
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            color: white;
            -webkit-user-select: none;
            user-select: none;
            z-index: 100;
            max-height: 85vh;
            overflow-y: auto; /* Allow scrolling if panel gets too long */
        }

        #ui-panel h2 {
            margin: 0 0 15px 0;
            font-size: 1.1rem;
            border-bottom: 1px solid rgba(255,255,255,0.3);
            padding-bottom: 5px;
        }

        #ui-panel .control-group {
            margin-bottom: 20px;
        }

        #ui-panel label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        #ui-panel input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        /* Toggle Switch Styles */
        .switch-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding: 4px 0;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 34px;
            height: 18px;
        }

        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #555;
            transition: .4s;
            border-radius: 18px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 12px;
            width: 12px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #4CAF50;
        }

        input:checked + .slider:before {
            transform: translateX(16px);
        }

        /* Planet Info Panel */
        #planet-info-panel {
            position: absolute;
            right: 0;
            top: 0;
            width: 350px; 
            height: 100%;
            background: rgba(20, 20, 40, 0.9);
            backdrop-filter: blur(10px);
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: -8px 0 32px 0 rgba(0, 0, 0, 0.5);
            padding: 20px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }

        #close-panel {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
        }

        #planet-info-panel h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-align: center;
            color: white;
        }

        .planet-image-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
            margin-bottom: 20px;
        }

        #planet-image {
            width: 180px;
            height: auto;
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
        }

        .info-section h2 {
            color: #4CAF50;
            font-size: 1.4em;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        .info-content {
            line-height: 1.6;
            color: #e0e0e0;
        }

        /* Planet buttons */
        #planet-buttons-container {
            position: absolute;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 999;
        }

        .planet-button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .planet-button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        /* Spinner animation */
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .spinner {
            animation: spin 2s linear infinite;
        }
    </style>
</head>

<body style="background-color: black;">
    <div id="info">
        <h1 style="color: white;">3D SOLAR SYSTEM SIMULATOR</h1>
        <p style="color: white;">Hold left click to rotate and wheel to zoom</p>
    </div>

    <div id="ui-panel">
        <h2>Controls</h2>
        <div class="control-group">
            <label for="speedSlider">Orbit Speed</label>
            <input type="range" id="speedSlider" min="0" max="10" step="0.1" value="1">
        </div>

        <div class="control-group">
            <label><input type="checkbox" id="textToggle" checked> Show Labels</label>
            <label><input type="checkbox" id="orbitToggle" checked> Show Orbit Paths</label>
        </div>

        <h2>Planets</h2>
        <div id="planet-toggles">
            <div class="switch-container"><span class="p-name">Mercury</span> <label class="switch"><input type="checkbox" data-id="0" checked><span class="slider"></span></label></div>
            <div class="switch-container"><span class="p-name">Venus</span> <label class="switch"><input type="checkbox" data-id="1" checked><span class="slider"></span></label></div>
            <div class="switch-container"><span class="p-name">Earth</span> <label class="switch"><input type="checkbox" data-id="2" checked><span class="slider"></span></label></div>
            <div class="switch-container"><span class="p-name">Mars</span> <label class="switch"><input type="checkbox" data-id="3" checked><span class="slider"></span></label></div>
            <div class="switch-container"><span class="p-name">Jupiter</span> <label class="switch"><input type="checkbox" data-id="4" checked><span class="slider"></span></label></div>
            <div class="switch-container"><span class="p-name">Saturn</span> <label class="switch"><input type="checkbox" data-id="5" checked><span class="slider"></span></label></div>
            <div class="switch-container"><span class="p-name">Uranus</span> <label class="switch"><input type="checkbox" data-id="6" checked><span class="slider"></span></label></div>
            <div class="switch-container"><span class="p-name">Neptune</span> <label class="switch"><input type="checkbox" data-id="7" checked><span class="slider"></span></label></div>
        </div>
    </div>

    <!-- Planet Buttons on the Right Side -->
    <div id="planet-buttons-container">
        <button class="planet-button" data-planet="mercury">M</button>
        <button class="planet-button" data-planet="venus">V</button>
        <button class="planet-button" data-planet="earth">E</button>
        <button class="planet-button" data-planet="mars">Ma</button>
        <button class="planet-button" data-planet="jupiter">J</button>
        <button class="planet-button" data-planet="saturn">S</button>
        <button class="planet-button" data-planet="uranus">U</button>
        <button class="planet-button" data-planet="neptune">N</button>
    </div>

    <!-- Planet Info Panel -->
    <div id="planet-info-panel">
        <button id="close-panel">×</button>
        <h1 id="panel-title"></h1>
        <div class="planet-image-container">
            <img id="planet-image" src="" alt="Planet Image" class="spinner">
        </div>
        
        <div class="info-section">
            <h2>Overview</h2>
            <p id="overview-content" class="info-content"></p>
        </div>
        
        <div class="info-section">
            <h2>Size & Distance</h2>
            <p id="size-distance-content" class="info-content"></p>
        </div>
        
        <div class="info-section">
            <h2>Moons</h2>
            <p id="moons-content" class="info-content"></p>
        </div>

        <div class="info-section">
            <h2>Atmosphere</h2>
            <p id="atmosphere-content" class="info-content"></p>
        </div>
    </div>

    <script src="./threejs/three.min.js"></script>
    <script src="./threejs/OrbitControls.js"></script>
    
    <!-- Assuming textures.js is in the same folder -->
    <script src="./textures.js"></script>
    <script>
         // --- Scene Setup ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 5000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        // Enable shadow maps in the renderer
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; 
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        camera.position.set(0, 150, 300);
        controls.update();

        // --- Lights ---
        // Ambient light: illuminates the shadows slightly so things aren't pitch black
        const ambientLight = new THREE.AmbientLight(0x404040, 0.5); 
        scene.add(ambientLight);

        // Point Light: Acts as the Sun (at center of the scene)
        const sunLight = new THREE.PointLight(0xffffff, 2.5, 1000); // Color, Intensity, Distance
        sunLight.castShadow = true;
        // Improve shadow quality
        sunLight.shadow.mapSize.width = 1024;
        sunLight.shadow.mapSize.height = 1024;
        scene.add(sunLight);

        // --- Milky Way Background (Skybox) ---
        let skyMat;
        if (textureMap["milkyway"] && textureMap["milkyway"].length > 20) {
            skyMat = new THREE.MeshBasicMaterial({ map: new THREE.TextureLoader().load(textureMap["milkyway"]), side: THREE.BackSide });
        } else {
            skyMat = new THREE.MeshBasicMaterial({ color: 0x050505, side: THREE.BackSide });
        }
        const sky = new THREE.Mesh(new THREE.SphereGeometry(2000, 64, 64), skyMat);
        scene.add(sky);

        // --- Starfield ---
        const starGeometry = new THREE.BufferGeometry();
        const starMaterial = new THREE.PointsMaterial({ color: 0xffffff });
        const starVertices = [];
        for (let i = 0; i < 10000; i++) {
            starVertices.push((Math.random() - 0.5) * 2000, (Math.random() - 0.5) * 2000, (Math.random() - 0.5) * 2000);
        }
        starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
        const stars = new THREE.Points(starGeometry, starMaterial);
        scene.add(stars);

        // --- Texture Loader ---
        const loader = new THREE.TextureLoader();

        // --- Helper: Create Planet with Label ---
        function createPlanet(name, size, distance, color, speed, hasMoon = false) {
            const orbitGroup = new THREE.Group();
            scene.add(orbitGroup);

            const planetGroup = new THREE.Group();
            planetGroup.position.x = distance; 
            orbitGroup.add(planetGroup);

            const geometry = new THREE.SphereGeometry(size, 32, 32);
            let material;

            // Use MeshStandardMaterial for planets so they react to the sunLight
            if (textureMap[name] && textureMap[name].length > 20) {
                material = new THREE.MeshStandardMaterial({ map: loader.load(textureMap[name]) });
            } else {
                material = new THREE.MeshStandardMaterial({ color: color });
            }

            const mesh = new THREE.Mesh(geometry, material);
            mesh.castShadow = true;       // Casts shadow onto other objects (like moons)
            mesh.receiveShadow = true;    // Receives shadows from the Sun/Moons
            planetGroup.add(mesh); 

            // The Label (Sprite)
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = 1024; 
            canvas.height = 512;  

            context.fillStyle = 'rgba(0, 0, 0, 0.6)'; 
            const panelHeight = 180; 
            const startY = (canvas.height - panelHeight) / 2;
            context.fillRect(0, startY, canvas.width, panelHeight);

            context.strokeStyle = 'black'; 
            context.lineWidth = 25; 
            context.font = 'Bold 180px Arial'; 
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            const upperName = name.toUpperCase();
            context.strokeText(upperName, canvas.width / 2, canvas.height / 2);
            context.fillStyle = 'white'; 
            context.fillText(upperName, canvas.width / 2, canvas.height / 2);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({ map: texture });
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.scale.set(size * 1.4, (size * 1.4) * 0.6, 1);
            sprite.position.y = size + (size * 0.5); 
            planetGroup.add(sprite);

            // Orbit Path Ring
            const orbitGeom = new THREE.RingGeometry(distance - 0.2, distance + 0.2, 64);
            const orbitMat = new THREE.MeshBasicMaterial({ color: 0x444444, side: THREE.DoubleSide });
            const orbitRing = new THREE.Mesh(orbitGeom, orbitMat);
            orbitRing.rotation.x = Math.PI / 2;
            scene.add(orbitRing);

            // Moon Logic
            let moon = null;
            if (hasMoon) {
                const moonGeom = new THREE.SphereGeometry(size * 0.3, 16, 16);
                let moonMat;
                if (textureMap["moon"] && textureMap["moon"].length > 20) {
                    moonMat = new THREE.MeshStandardMaterial({ map: loader.load(textureMap["moon"]) });
                } else {
                    moonMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa });
                }
                moon = new THREE.Mesh(moonGeom, moonMat);
                moon.position.x = size + 4; 
                moon.castShadow = true;
                moon.receiveShadow = true;
                planetGroup.add(moon); 
            }

            // Saturn's Rings Logic
            let saturnRing = null;
            if (name === "Saturn") {
                const ringGeom = new THREE.RingGeometry(size * 1.8, size * 2.8, 64);
                let ringMat;
                if (textureMap["saturnring"] && textureMap["saturnring"].length > 20) {
                    ringMat = new THREE.MeshStandardMaterial({ map: loader.load(textureMap["saturnring"]), side: THREE.DoubleSide, transparent: true });
                } else {
                    ringMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, side: THREE.DoubleSide, transparent: true, opacity: 0.6 });
                }
                saturnRing = new THREE.Mesh(ringGeom, ringMat);
                saturnRing.rotation.x = Math.PI / 2; 
                planetGroup.add(saturnRing); 
            }

            return { orbitGroup, planetGroup, speed, sprite: sprite, orbitRing: orbitRing };
        }

        // --- Create Solar System (All 8 Planets) ---
        const planets = [
            createPlanet("Mercury", 1.5, 20, 0xaaaaaa, 0.04 * 0.4),
            createPlanet("Venus", 3, 30, 0xffcc00, 0.015 * 0.4),
            createPlanet("Earth", 3.2, 45, 0x2233ff, 0.01 * 0.4, true),
            createPlanet("Mars", 2, 60, 0xff4400, 0.008 * 0.4, true),
            createPlanet("Jupiter", 10, 90, 0xccaa88, 0.004 * 0.4),
            createPlanet("Saturn", 8, 120, 0xffddaa, 0.002 * 0.4),
            createPlanet("Uranus", 7, 150, 0xadd8e6, 0.001 * 0.4),
            createPlanet("Neptune", 6, 180, 0x0000ff, 0.0008 * 0.4)
        ];

        // The Sun - Using MeshBasicMaterial so the texture displays perfectly and isn't affected by light
        const sunGeom = new THREE.SphereGeometry(15, 32, 32);
        let sunMat;
        if (textureMap["sun"] && textureMap["sun"].length > 20) {
            // BasicMaterial ensures the texture is always visible and "lit"
            sunMat = new THREE.MeshBasicMaterial({ map: loader.load(textureMap["sun"]) });
        } else {
            sunMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
        }
        const sun = new THREE.Mesh(sunGeom, sunMat);
        scene.add(sun);

        // --- UI Interaction Logic ---
        let orbitSpeedMultiplier = 1;
        const speedSlider = document.getElementById('speedSlider');
        const textToggle = document.getElementById('textToggle');
        const orbitToggle = document.getElementById('orbitToggle');

        speedSlider.addEventListener('input', (e) => {
            orbitSpeedMultiplier = e.target.value;
        });

        textToggle.addEventListener('change', (e) => {
            planets.forEach(p => {
                if (p.sprite) p.sprite.visible = e.target.checked;
            });
        });

        orbitToggle.addEventListener('change', (e) => {
            planets.forEach(p => {
                if (p.orbitRing) p.orbitRing.visible = e.target.checked;
            });
        });

        // Planet individual toggles logic
        document.querySelectorAll('#planet-toggles input').forEach(checkbox => {
            checkbox.addEventListener('change', (e) => {
                const index = e.target.getAttribute('data-id');
                if (planets[index]) {
                    const isChecked = e.target.checked;
                    // Hide both the planet mesh/group and its specific orbit ring
                    planets[index].planetGroup.visible = isChecked;
                    if(planets[index].orbitRing) planets[index].orbitRing.visible = isChecked;
                }
            });
        });

        // --- Planet Info Panel Logic ---
        const panel = document.getElementById('planet-info-panel');
        const closePanelBtn = document.getElementById('close-panel');
        const panelTitle = document.getElementById('panel-title');
        const planetImage = document.getElementById('planet-image');
        const overviewContent = document.getElementById('overview-content');
        const sizeDistanceContent = document.getElementById('size-distance-content');
        const moonsContent = document.getElementById('moons-content');
        const atmosphereContent = document.getElementById('atmosphere-content');

        // Planet information data
        const planetInfo = {
            mercury: {
                name: "Mercury",
                overview: "The smallest and innermost planet in the Solar System, Mercury is known for its rapid orbit around Earth. It has a diameter of about 4,869 km.",
                sizeDistance: "Diameter: ~4,870 km | Distance from Sun: ~58 million km (0.39 AU) | Orbital Period: ~116 days",
                moons: "Mercury has no moons and is the only planet without any orbital companions.",
                atmosphere: "Mercury has virtually no atmosphere due to its small size and weak gravitational pull."
            },
            venus: {
                name: "Venus",
                overview: "Often called Earth's sister, Venus is the second planet from the Sun with a similar size. It rotates in the opposite direction of most planets.",
                sizeDistance: "Diameter: ~12,104 km | Distance from Sun: ~108 million km (0.72 AU) | Orbital Period: ~225 days",
                moons: "Venus has no moons and is the only planet without any orbital companions.",
                atmosphere: "Venus features a dense atmosphere with pressures of approximately 100 times that of Earth."
            },
            earth: {
                name: "Earth",
                overview: "The third planet from the Sun, Earth is the largest of the planets in the Solar System. It's known as 'the human race' and has one moon.",
                sizeDistance: "Diameter: ~12,756 km | Distance from Sun: ~149 million km (1 AU) | Orbital Period: 365 days",
                moons: "Earth has one moon, the largest of its three known satellites. The Moon orbits Earth every ~29.5 days.",
                atmosphere: "Earth's atmosphere is characterized by a wide range of gases and molecules with temperatures ranging from -100°F to +100°F."
            },
            mars: {
                name: "Mars",
                overview: "Known as the Red Planet, Mars has a diameter about 40% that of Earth. It's named after the Roman god of war.",
                sizeDistance: "Diameter: ~6,787 km | Distance from Sun: ~228 million km (1.5 AU) | Orbital Period: ~687 days",
                moons: "Mars has two moons: Phobos and Deimos. Both are small, rocky satellites.",
                atmosphere: "Mars' atmosphere is much less dense than Earth's, with a pressure approximately 0.3% that of Earth."
            },
            jupiter: {
                name: "Jupiter",
                overview: "The largest planet in the Solar System, Jupiter is an enormous planet composed mostly of solid elements and is known for its distinctive red color.",
                sizeDistance: "Diameter: ~142,984 km | Distance from Sun: ~778 million km (5.2 AU) | Orbital Period: ~12 years",
                moons: "Jupiter has 130+ confirmed moons with the most significant being the 'Big Three': Io, Europa, and Ganymede.",
                atmosphere: "Jupiter's atmosphere is characterized by layers of color-changing clouds made up mainly of gases."
            },
            saturn: {
                name: "Saturn",
                overview: "Famous for its distinctive ring system, Saturn is a large planet with a massive collection of rings around its body.",
                sizeDistance: "Diameter: ~120,536 km | Distance from Sun: ~1.4 billion km (9.5 AU) | Orbital Period: ~29 years",
                moons: "Saturn has over 100 known moons with the largest being Titan and Rhea.",
                atmosphere: "Saturn's atmospheric composition is similar to Jupiter, including a wide range of gases and temperatures."
            },
            uranus: {
                name: "Uranus",
                overview: "The first planet discovered by modern methods, Uranus has an unusual sideways orientation with its axis tilted 90 degrees.",
                sizeDistance: "Diameter: ~51,118 km | Distance from Sun: ~2.9 billion km (19.2 AU) | Orbital Period: ~84 years",
                moons: "Uranus has more than 27 known moons with the largest being Titania and Oberon.",
                atmosphere: "Uranus has a highly compressed atmospheric structure, with temperatures reaching as low as -220°C."
            },
            neptune: {
                name: "Neptune",
                overview: "The last planet discovered in the Solar System, Neptune is similar to Uranus but slightly larger and more massive.",
                sizeDistance: "Diameter: ~49,528 km | Distance from Sun: ~4.5 billion km (30.1 AU) | Orbital Period: ~165 years",
                moons: "Neptune has 16 known moons with the largest being Triton, which rotates in the opposite direction of its orbit.",
                atmosphere: "Neptune features a highly compressed atmospheric structure similar to Uranus but with more extreme temperatures."
            }
        };

        // Show planet info panel
        function showPlanetInfo(planetName) {
            const info = planetInfo[planetName.toLowerCase()];
            if (!info) return;
            
            panelTitle.textContent = info.name;
            overviewContent.textContent = info.overview;
            sizeDistanceContent.textContent = info.sizeDistance;
            moonsContent.textContent = info.moons;
            atmosphereContent.textContent = info.atmosphere;
            
            // Set planet image (we'll use a placeholder for now)
            planetImage.src = `https://placehold.co/180x180?text=${info.name}`;
            planetImage.classList.remove('spinner');
            
            panel.style.display = 'block';
        }

        // Close panel
        closePanelBtn.addEventListener('click', () => {
            panel.style.display = 'none';
        });

        // Planet buttons click handlers
        document.querySelectorAll('.planet-button').forEach(button => {
            button.addEventListener('click', (e) => {
                const planetName = e.target.getAttribute('data-planet');
                showPlanetInfo(planetName);
            });
        });

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);

            planets.forEach((p) => {
                // Only rotate if the group is visible (optional, but cleaner for performance)
                if (p.planetGroup.visible !== false || p.orbitGroup.rotation.y > 0) {
                    p.orbitGroup.rotation.y += p.speed * orbitSpeedMultiplier; 
                    p.planetGroup.rotation.y += 0.01;    
                }
            });

            // Sun rotation
            sun.rotation.y += 0.002; 

            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
